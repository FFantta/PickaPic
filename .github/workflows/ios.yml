name: iOS and local storage
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app and widget without signing
        run: xcodebuild -project PickaPic/PickaPic.xcodeproj -scheme PickaPic -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
